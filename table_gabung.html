<!DOCTYPE html>
<html>
    <head>
        <title>colspan dan rowspan</title>
        <link rel="stylesheet" href="table_gabung.css">
    </head>
    <body>
        <h2>colspan dan rowspan</h2>
        <table>
            <tr>
                <th rowspan="2">No</th>
                <th rowspan="2">Nama</th>
                <th colspan="2">Nilai</th>
            </tr>
            <tr>
                <td>1</td>
                <td>Glori</td>
                <td>90</td>
                <td>60</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Bob</td>
                <td>30</td>
                <td>40</td>
            </tr>   
            </tr>
            <tr>
                <td>3</td>
                <td>Charlie</td>
                <td>28</td>
                <td>50</td>
            </tr>
             <tr>
                <td>4</td>
                <td>David</td>
                <td>35</td>
                <td>45</td>
            </tr>
             <tr>
                <td>5</td>
                <td>Eve</td>
                <td>42</td>
                <td>38</td>
            </tr>
        </table>
    </body>
</html>
