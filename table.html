<!DOCTYPE html>
<html>
    <head>
        <title>Table HTML dan CSS</title>
        <link rel="stylesheet" href="table.css">
    </head>
    <body>
        <h2>Table HTML dan CSS</h2>
        <table>
            <tr>
                <th>No</th>
                <th>Nama</th>
                <th>Nilai</th>
            </tr>
            <tr>
                <td>1</td>
                <td>Glori</td>
                <td>90</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Bob</td>
                <td>30</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Charlie</td>
                <td>28</td>
            </tr>
    </body>
</html>
